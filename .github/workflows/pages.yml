name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://iyjodzxjodygjpkvlvwt.supabase.co
      # anon/publishable key and the browser-restricted Maps key are public by design (they ship in the bundle)
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_oJV1lC6n8f7KfJ8sopjIoA__P_ina3K
      EXPO_PUBLIC_BACKEND: supabase
      EXPO_PUBLIC_GOOGLE_MAPS_KEY: AIzaSyDNFK7MH-JGwyDiRRu8yNflijMpdB0DkS4
      REPO_NAME: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: ./scripts/build-pages.sh
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
